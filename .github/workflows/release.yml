# Publishes a GitHub Release with the signed Android app when a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Players always find the newest app at
#   https://github.com/bartekmotyl/functional-marble-machine/releases/latest/download/functional-marble-machine.apk
#
# Needs the app's signing key as repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See "Releases" in README.md for how to make the key. Keep the key safe: every update must be
# signed with the same key, or phones refuse to install it over the old version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing - see 'Releases' in README.md"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Build the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            **Android:** download `functional-marble-machine.apk` below and open it on your phone (allow installing apps from your browser or file manager when asked). A newer version installs over an older one and keeps your progress.

            **Web:** play at https://bartekmotyl.github.io/functional-marble-machine/
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk functional-marble-machine.apk
          gh release create "$GITHUB_REF_NAME" functional-marble-machine.apk \
            --title "Functional Marble Machine $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --generate-notes
