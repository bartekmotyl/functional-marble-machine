# Builds the Android app (a debug APK) with Capacitor on every push to main.
# Download it from the run's "Artifacts" section on the Actions tab.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK after the commit
        run: mv android/app/build/outputs/apk/debug/app-debug.apk functional-marble-machine-${GITHUB_SHA::7}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: functional-marble-machine-apk
          path: functional-marble-machine-*-debug.apk
          if-no-files-found: error
